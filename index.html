<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#0c0a0d">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Histoires Noires</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- Écran 1 : choix de l'histoire -->
  <div id="screen-stories" class="screen active">
    <h1 class="app-title">HISTOIRES NOIRES</h1>
    <p class="subtitle">Choisissez une affaire.</p>
    <div id="stories-list" class="stories-list"></div>
  </div>

  <!-- Écran 2 : choix de la difficulté -->
  <div id="screen-menu" class="screen">
    <button id="btn-back-stories" class="link-btn top-left">← Histoires</button>
    <h1 id="menu-title"></h1>
    <p id="menu-tagline" class="subtitle"></p>
    <p id="menu-intro" class="subtitle"></p>

    <div class="menu-card">
      <h2>Difficulté</h2>
      <div id="difficulty-options" class="difficulty-options"></div>
      <button id="btn-start" class="start-btn"></button>
    </div>
  </div>

  <!-- Écran 3 : partie en cours -->
  <div id="screen-game" class="screen screen-game">
    <div class="game-header">
      <button id="btn-menu" class="link-btn">← Menu</button>
      <div class="stats">
        <span id="stat-remaining"></span>
        <span id="stat-clue-count"></span>
      </div>
    </div>

    <div class="tabs">
      <button class="tab-btn active" data-tab="clues" id="tab-btn-clues"></button>
      <button class="tab-btn" data-tab="suspects" id="tab-btn-suspects"></button>
    </div>

    <div class="game-body">
      <div id="tab-clues" class="tab-panel active">
        <ol id="clues-list"></ol>
        <button id="btn-next-clue" class="next-clue-btn"></button>
      </div>

      <div id="tab-suspects" class="tab-panel">
        <input id="filter-input" type="text" placeholder="Rechercher un nom...">
        <div id="suspects-grid" class="suspects-grid"></div>
      </div>
    </div>

    <div class="accuse-bar">
      <input id="accuse-input" type="text" placeholder="">
      <button id="btn-accuse"></button>
    </div>
  </div>

  <!-- Écran 4 : résultat -->
  <div id="screen-result" class="screen">
    <div id="result-content"></div>
    <button id="btn-replay" class="start-btn">Rejouer</button>
  </div>

  <script src="data/stories.js"></script>
  <script src="game.js"></script>
  <script src="app.js"></script>
</body>
</html>
