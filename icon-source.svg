<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1a0e12"/>
      <stop offset="100%" stop-color="#0c0a0d"/>
    </linearGradient>
  </defs>

  <!-- fond -->
  <rect width="512" height="512" fill="url(#bg)"/>

  <!-- cercle de sceau -->
  <circle cx="256" cy="256" r="182" fill="none" stroke="#c9a24b" stroke-width="5"/>
  <circle cx="256" cy="256" r="160" fill="none" stroke="#c9a24b" stroke-width="2"/>

  <!-- dague verticale (Le Contrat) -->
  <g>
    <polygon points="256,110 268,230 244,230" fill="#b5121f"/>
    <rect x="242" y="230" width="28" height="12" fill="#c9a24b"/>
    <rect x="250" y="242" width="12" height="90" fill="#8a1c2e"/>
    <polygon points="256,332 268,352 244,352" fill="#c9a24b"/>
  </g>

  <!-- rose stylisee (Sang & Soie), petales autour du centre -->
  <g>
    <circle cx="180" cy="330" r="26" fill="#7a0c17" opacity="0.9"/>
    <circle cx="215" cy="345" r="26" fill="#7a0c17" opacity="0.9"/>
    <circle cx="150" cy="350" r="24" fill="#7a0c17" opacity="0.85"/>
    <circle cx="185" cy="365" r="22" fill="#a3121f" opacity="0.9"/>
    <circle cx="182" cy="345" r="16" fill="#e6c878"/>
  </g>

  <!-- goutte -->
  <path d="M332 340 C332 355 320 366 308 366 C296 366 284 355 284 340 C284 325 308 300 308 300 C308 300 332 325 332 340 Z"
        fill="#b5121f"/>
</svg>
